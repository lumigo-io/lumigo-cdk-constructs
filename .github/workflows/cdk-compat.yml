name: cdk-compat
on:
  schedule:
    - cron: 0 6 * * 1
  pull_request: {}
  workflow_dispatch: {}
jobs:
  floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: yarn install --check-files
      - name: Install the floor aws-cdk-lib
        run: yarn add --dev aws-cdk-lib@2.42.1 @aws-cdk/aws-lambda-python-alpha@2.42.1-alpha.0
      - name: Report the tested version
        run: node -p "'aws-cdk-lib ' + require('aws-cdk-lib/package.json').version"
      - name: test
        run: npx projen test
  latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: yarn install --check-files
      - name: Install the latest aws-cdk-lib
        run: yarn add --dev aws-cdk-lib@latest @aws-cdk/aws-lambda-python-alpha@latest
      - name: Report the tested version
        run: node -p "'aws-cdk-lib ' + require('aws-cdk-lib/package.json').version"
      - name: test
        run: npx projen test
